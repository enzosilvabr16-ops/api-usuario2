services:

  mysql:
    image: mysql:8
    container_name: api-usuarios-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: coti
      MYSQL_DATABASE: db-usuarios
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - api-usuarios-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pcoti --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: api-usuarios-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: coti
    ports:
      - "5052:80"
    volumes:
      - phpmyadmin_data:/sessions
    networks:
      - api-usuarios-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://localhost/\") === false ? 1 : 0);'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


volumes:

  mysql_data:
    name: api-usuarios-mysql-data

  phpmyadmin_data:
    name: api-usuarios-phpmyadmin-data


networks:

  api-usuarios-network:
    name: api-usuarios-network
    driver: bridge